name: Release

on:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not fully configured"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Verify Release signature
        env:
          EXPECTED_CERT_SHA256: 3cfb2d32db4526e9cce22a0092a7d6819659db433cfec613fed68d44d999682a
        run: |
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found"
            exit 1
          fi
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          ACTUAL_CERT_SHA256=$(printf '%s\n' "$SIGNATURE_INFO" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Verified signing certificate: $ACTUAL_CERT_SHA256"

      - name: Rename APK
        run: | 
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/OneUIX_${{ github.ref_name }}.apk

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/OneUIX_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
